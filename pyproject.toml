[project]
name = "ssm-pdm"
version = "0.1.0"
description = "Application of SSM models to RUL estimation with the addition of SQR for uncertainty estimation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calflops>=0.3.2",
    "einops>=0.8.1",
    "filelock>=3.16.1",
    "ipdb>=0.13.13",
    "llvmlite>=0.39,<0.42",
    "numba>=0.56,<0.59",
    "numpy<2",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "python-dotenv>=1.2.2",
    "pytorch-lightning>=2.6.0",
    "ruff>=0.14.11",
    "s5-pytorch>=0.2.1",
    "scikit-learn>=1.3.2",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "setproctitle>=1.3.7",
    "tabulate>=0.9.0",
    "torch>=2.8.0",
    "torchinfo>=1.8.0",
    "transformer-encoder>=0.0.3",
    "transformers>=4.57.5",
    "wandb>=0.23.1",
]
