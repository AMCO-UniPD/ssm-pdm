[project]
name = "ssm-pdm"
version = "0.1.0"
description = "Application of SSM models to RUL estimation with the addition of SQR for uncertainty estimation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ceruleo>=3.0.6",
    "ipdb>=0.13.13",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "setproctitle>=1.3.7",
    "tabulate>=0.9.0",
    "wandb>=0.23.1",
]
