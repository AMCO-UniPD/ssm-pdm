# Configuration file for wandb sweep experiments

sweep_method: bayes
sweep_param_names:
  - batch_size
  - d_model
  - n_layers
  - d_ff
  - n_heads
  - lr
  - dropout

# The experiment keeps sequence_length=stride=5000. Standard attention is
# quadratic in that length, so begin with deliberately conservative capacities.
batch_size_vals: [1, 2, 4, 8]
d_model_vals: [32, 64, 128]
n_layers_vals: [1, 2, 3, 4]
d_ff_vals: [64, 128, 256]
n_heads_vals: [2, 4, 8]
lr_vals: [0.001, 0.01]
dropout_vals: [0.1, 0.5]

#NOTE: AD sweep
ad: false
