# config file for ssm models
# NOTE: See default parameters on the definition of ModelConfig class

# General model parametrers
d_model: 128
n_layers: 5
dropout: 0.1

# Global Average Pooling in the Regression Head
gap: false

# Quantile Regression config
quantile_reg: true
# tau_mult approach
tau_mult: true
# tau as input feature
tau_feat: true

# S4 config
lr: 0.006
activation: relu
gate_act: null
mult_act: null
final_act: glu
prenorm: false

# S4D config
d_state: 64
act: relu

# S5 config
bidir: false
ff_dropout: 0.2
attn_dropout: 0.2

# RULTransformer config
d_ff: 64
n_heads: 8

# RULInformer config
factor: 5
attn: prob
inf_activation: gelu
distil: true
