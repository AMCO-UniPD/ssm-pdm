# Configuration file for ssm experiments on PHM dataset
# NOTE: See default parameters on the definition of ExperimentConfig class

# Dataset
test_size: 0.2
val_size: 0.1

# dataset transformations
transformer_type: 1
# scaler: standard
scaler: minmax # minmax for MinMaxScaler, standard for StandardScaler
scaler_kwargs:
  low_limit: -1.0
  high_limit: 1.0

# approach
approach: windowed
# approach: padding

# quantile_reg config
quantile_reg: true
quantile_dist: uniform
bounds: [0.1, 0.9]
# quantiles: [0.1,0.25,0.5,0.75,0.9]
quantiles: [0.5]
quantile_run: 0.25

#WARN: These parameters are probably to tune for the PHM dataset
batch_size: 16
sequence_length: 10000
stride: 3000
epochs: 50
lr: 0.007790009334009813
weight_decay: 1.0e-4

# loss parameters
loss: quantile_reg
eval_loss: rmse

# multi run parameters
n_runs: 1 #NOTE: test
# n_runs: 5
start_run_id: 0

# model summary
summary_func: torchinfo

# quantile plots
plot_run_id: 1
quantile_plot: 0.25
# life_idx: [0,1,5,11]
life_idx: [77,97,129,228]
nrows: 2
ncols: 2
# ncols: 3
full_life: false
save_plot: true

