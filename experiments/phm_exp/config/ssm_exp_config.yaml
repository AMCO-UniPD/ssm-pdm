# Configuration file for ssm experiments on PHM dataset
# NOTE: See default parameters on the definition of ExperimentConfig class

# Dataset
test_size: 0.2
val_size: 0.1

# dataset transformations
transformer_type: 1
scaler: standard
# scaler: minmax # minmax for MinMaxScaler, standard for StandardScaler
scaler_kwargs:
  low_limit: -1.0
  high_limit: 1.0

# approach
approach: windowed

# quantile_reg config
quantile_reg: true
quantile_dist: uniform
bounds: [0.1, 0.9]
quantiles: [0.1,0.25,0.5,0.75,0.9]
quantile_run: 0.25

#WARN: These parameters are probably to tune for the PHM dataset
batch_size: 100
sequence_length: 170

# multi run parameters
n_runs: 5
start_run_id: 0

#NOTE: The following parameters are all set through the command line
# with the define_arguments function

