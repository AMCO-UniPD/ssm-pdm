
# Dataset
test_size: 0.2
val_size: 0.1

# dataset transformations
transformer_type: 1 # data normalization
# transformer_type: 2 # no data normalization
feature_type: phm
# scaler: standard
scaler: minmax # minmax for MinMaxScaler, standard for StandardScaler
scaler_kwargs:
  low_limit: 0.0
  high_limit: 1.0

# approach
monotonic: true
quantile_reg: true
approach: windowed_quantile_weighted_monotonic
# approach: windowed_weighted_monotonic
# approach: windowed_quantile_standard

# quantile_reg config
quantile_dist: uniform
bounds: [0.1, 0.9]
quantiles: [0.1,0.25,0.5,0.75,0.9]
# quantiles: [0.75]
quantile_run: 0.25

# select_windows (windowed approach)
max_rul: 500
keep_long_rul_prob: 0.1
n_const_win: 0
normalize_rul: true

# training parameters
batch_size: 16
sequence_length: 5000
stride: 5000
epochs: 30
lr: 0.001
weight_decay: 1.0e-4

# loss parameters
loss: window_quantile_reg
eval_loss: window_pinball
# loss: quantile_reg
# eval_loss: pinball
life_eval_loss: rmse

# multi run parameters
n_runs: 1
start_run_id: 0

# model summary
summary_func: torchinfo

# RUL plots
file_pos: 0
plot_run_id: 1
quantile_plot: 0.5
plot_life_idx: [0,1,2,3]
# life_idx: [0]
col_idx: 0
# start_idx: 0
# end_idx: 5000
n_last_samples: 5000
nrows: 2
ncols: 2
full_life: false
save_plot: true
show_plot: false

# raw signal plots
use_test_set: true

# business metrics plots
life_idx: [0,1,2,3,4]
max_windows: 100
n_maintenance_windows: 10

