
# NOTE: See default parameters on the definition of ExperimentConfig class

# Dataset
test_size: 0.2
val_size: 0.1

# dataset transformations
transformer_type: 2
feature_type: phm
# scaler: standard
scaler: minmax # minmax for MinMaxScaler, standard for StandardScaler
scaler_kwargs:
  low_limit: -1.0
  high_limit: 1.0

# approach
monotonic: false
quantile_reg: false
approach: windowed_standard

# quantile_reg config
quantile_dist: uniform
bounds: [0.1, 0.9]
quantiles: [0.1,0.25,0.5,0.75,0.9]
# quantiles: [0.5]
quantile_run: 0.25

# select_windows (windowed approach)
max_rul: 500
keep_long_rul_prob: 0.1
n_const_win: 0
normalize_rul: true
# normalize_rul: false

#AD approach
ad: false

# training parameters
batch_size: 16
sequence_length: 1000
stride: 500
epochs: 10
lr: 0.001
weight_decay: 1.0e-4

# loss parameters
# loss: window_quantile_reg # for quantile_reg
# eval_loss: window_pinball
loss: mse
eval_loss: rmse
life_eval_loss: rmse

# multi run parameters
n_runs: 5
start_run_id: 0

# model summary
summary_func: torchinfo

# quantile plots
file_pos: 0
plot_run_id: 1
quantile_plot: 0.5
# life_idx: [0,1,5,11]
# life_idx: [77,97,129,228]
life_idx: [0,1,2,3]
# life_idx: [0]
col_idx: 0
# start_idx: 0
# end_idx: 5000
nrows: 2
ncols: 2
# ncols: 3
full_life: false
save_plot: true
# save_plot: false
show_plot: false

# raw signal plots
use_test_set: true

