# config file for ssm models

random_init: true # SSM models are always randomly initialized

# General model parametrers
d_model: 128
n_layers: 5
dropout: 0.2

# S4 config
lr: 1e-03
activation: relu
gate_act: null
mult_act: null
final_act: glu
prenorm: false

# S4D config
d_state: 64
act: gelu

# S5 config
bidir: false

# RULTransformer config
d_ff: 128
n_heads: 8

# RULInformer config
factor: 5
attn: prob
inf_activation: gelu
distil: true
