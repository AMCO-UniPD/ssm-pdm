# Config file for the experiment

# Paths to the config files
model_config_path: config/config.yaml

# cuda config
device_num: 2

# wandb config
project_name: "chronos-rul"

# Dataset configurations
data_name: CMAPSS # CMAPSS, CMPASS-2
val_idx:
  - 0
  - 15
test_idx:
  - 15
  - 30
val_size: 0.3
cmapss_models: FD001 # FD001, FD002, FD003, FD004

# Feature extraction configurations
transformer_type: 1 # 1,2
window_size: 20
features:
  - kurtosis
  - skewness
  - mean
  - rms
scaler: minmax # minmax for MinMaxScaler, standard for StandardScaler
scaler_kwargs:
  low_limit: -1.0
  high_limit: 1.0

# Training parameters
epochs: 10
lr: 1.0e-3
sequence_length: 500
# sensors:
#   - SensorMeasure2
#   - SensorMeasure3

# Model configurations
model_id: amazon/chronos-t5-small
model_name: chronos-rul # in the future: S4,S5,S4D?
# model_name: chronos-random
# num_labels: 1

# Loss function to use for training
loss: mae
# Loss function to use for evaluation
eval_loss: rmse
# tau parameter for the quantile loss
tau: 0.5

# test_script config
test_script: true
file_pos: 0
save_outputs: false
compute_metrics: false
obsidian_table: false
plot_preds: true

# plot function config
save_plot: true
full_life: false
life_idx: [14,13,0,5,7,2,3,9,11]
nrows: 3
ncols: 3
sensor_idx: 0
