# Config file for the experiment

# cuda config
device_num: 0

# Dataset configurations
data_name: CMAPSS # CMAPSS, CMPASS-2
train: true
cmapss_models: FD001 # FD001, FD002, FD003, FD004
scaler: minmax # minmax for MinMaxScaler, standard for StandardScaler
scaler_kwargs:
  low_limit: -1.0
  high_limit: 1.0
sensors:
  - SensorMeasure2
  - SensorMeasure3

# Model configurations
model_id: amazon/chronos-t5-small
num_labels: 1
